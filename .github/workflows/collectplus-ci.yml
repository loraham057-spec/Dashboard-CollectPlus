name: CollectPlus - revue securite et tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-app:
    name: Syntaxe, controles d'acces et parcours API
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7
      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntaxe Python et JSON
        run: |
          python -m compileall -q app tests scripts
          python -m json.tool app/static/geo/index.json > /dev/null
      - name: Tests unitaires de la logique metier
        run: python -m unittest tests.test_core -v
      - name: Syntaxe JavaScript
        run: |
          for f in app/static/*.js; do node --check "$f"; done
      - name: Tests API securite et flux public
        env:
          COLLECTPLUS_ADMIN_USERNAME: ci-admin
          COLLECTPLUS_ADMIN_PASSWORD: ci-password-test-only
          COLLECTPLUS_COLLECTOR_USERNAME: ci-collector
          COLLECTPLUS_COLLECTOR_PASSWORD: ci-collector-test-only
          COLLECTPLUS_DB: /tmp/collectplus-ci.db
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health > health.json; then break; fi
            sleep 1
          done
          python tests/security_api_smoke.py
      - name: Construire l'image Docker
        run: docker build -t collectplus:ci .
