<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CollectPlus — Collecter, Analyser, Décider</title>
  <meta name="theme-color" content="#0d2a47">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <a class="skip" href="#view">Aller au contenu</a>
  <div class="app">
    <aside class="sidebar" aria-label="Navigation principale">
      <a class="brand" href="#/">
        <span class="brand-ic"><svg class="ic"><use href="/static/icons.svg#i-logo"/></svg></span>
        <span><strong>CollectPlus</strong><small>Collecter · Analyser · Décider</small></span>
      </a>
      <nav id="nav"></nav>
      <div id="syncCard" class="sync-wrap"></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" data-act="nav-toggle" aria-label="Ouvrir ou fermer le menu"><svg class="ic"><use href="/static/icons.svg#i-menu"/></svg></button>
        <div class="search">
          <svg class="ic"><use href="/static/icons.svg#i-search"/></svg>
          <input id="globalSearch" type="search" placeholder="Rechercher un formulaire, une soumission..." aria-label="Recherche globale" autocomplete="off">
          <div id="searchRes" class="search-res" hidden></div>
        </div>
        <div class="top-r">
          <button id="bellBtn" class="icon-btn bell" aria-label="Notifications"><svg class="ic"><use href="/static/icons.svg#i-bell"/></svg><span id="bellBadge" class="badge-n" hidden></span></button>
          <button class="icon-btn" data-act="help" aria-label="Aide"><svg class="ic"><use href="/static/icons.svg#i-help"/></svg></button>
          <div id="userChip" class="user"></div>
        </div>
      </header>
      <main id="view" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>
  <div id="overlay"></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">CollectPlus nécessite JavaScript.</p></noscript>
  <script src="/static/util.js"></script>
  <script src="/static/charts.js"></script>
  <script src="/static/geomap.js"></script>
  <script src="/static/formkit.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
